[project]
name = "prompt-atelier"
description = "Build image prompts from words, DART tags and photos: local vision captions, custom instructions, character triggers and native MOSS layouts."
version = "1.5.1"
requires-python = ">=3.10"
dependencies = ["transformers>=4.46,<6", "torch>=2.4"]
license = { file = "LICENSE" }
readme = "README.md"
keywords = ["comfyui", "prompt", "dart", "qwen", "vision", "moss", "caption"]

[project.urls]
Repository = "https://github.com/Renz1998/ComfyUI-Prompt-Atelier"
Documentation = "https://github.com/Renz1998/ComfyUI-Prompt-Atelier/blob/main/QUICKSTART.md"

[tool.comfy]
DisplayName = "Prompt Atelier"
Icon = "https://raw.githubusercontent.com/Renz1998/ComfyUI-Prompt-Atelier/main/assets/icon.svg"
Banner = "https://raw.githubusercontent.com/Renz1998/ComfyUI-Prompt-Atelier/main/assets/banner.svg"
PublisherId = "renz1998"
